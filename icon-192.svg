      <stop offset="0%" stop-color="#7061E7"/>
      <stop offset="100%" stop-color="#9C8EFF"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
